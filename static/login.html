<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion — Atlas Numérique du Cameroun</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/login.css" />
  <script src="/static/auth.js"></script>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <div class="login-flag">
        <span class="flag-green"></span><span class="flag-red"></span><span class="flag-yellow"></span>
      </div>
      <h1 class="login-title">Atlas Numérique</h1>
      <p class="login-subtitle">Interface d'administration sécurisée</p>
    </div>

    <!-- Message d'erreur géré par AtlasAuth -->
    <p id="loginError" class="login-message error" style="display:none;"></p>

    <!-- Formulaire géré par AtlasAuth.bindLoginForm() -->
    <form id="loginForm" class="login-form">
      <div class="form-group">
        <label for="username" class="form-label">Nom d'utilisateur</label>
        <input type="text" id="username" name="username" class="form-input" required autocomplete="username" placeholder="ex: User123" />
      </div>
      <div class="form-group">
        <label for="password" class="form-label">Mot de passe</label>
        <input type="password" id="password" name="password" class="form-input" required autocomplete="current-password" placeholder="••••••••" />
      </div>
      <button type="submit" class="login-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        Se connecter
      </button>
    </form>

    <div class="login-footer">
      <strong>Sécurité :</strong> Session protégée par cookie HTTP-only.<br>
      Ne partagez jamais vos identifiants.
    </div>
  </div>

  <!-- AtlasAuth s'initialise automatiquement au chargement -->
</body>
</html>
