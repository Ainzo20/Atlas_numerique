<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion — Atlas Numérique du Cameroun</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/login.css" />
</head>
<body>

  <div class="login-container">
    <div class="login-header">
      <div class="login-flag">
        <span class="flag-green"></span>
        <span class="flag-red"></span>
        <span class="flag-yellow"></span>
      </div>
      <h1 class="login-title">Atlas Numérique</h1>
      <p class="login-subtitle">Interface d'administration sécurisée</p>
    </div>

    <!-- Message d'erreur (affiché via JS si l'URL contient ?error=invalid_key) -->
    <div id="error-msg" class="login-message error">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
      <span>Clé API invalide, expirée ou révoquée.</span>
    </div>

    <!-- Formulaire qui envoie la donnée via POST à /api/login -->
    <form action="/api/login" method="POST">
      <div class="form-group">
        <label for="api_key" class="form-label">Clé d'authentification</label>
        <input 
          type="password" 
          id="api_key" 
          name="api_key" 
          class="form-input"
          required 
          autocomplete="off"
          placeholder="atlas_live_..."
        />
        <p class="form-hint">
          Entrez la clé fournie par l'administrateur.<br>
          Elle commence toujours par <code>atlas_live_</code>
        </p>
      </div>

      <button type="submit" class="login-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        Se connecter
      </button>
    </form>

    <div class="login-footer">
      <strong>Sécurité :</strong> Votre session est protégée par un cookie sécurisé.<br>
      Ne partagez jamais votre clé d'accès.
    </div>
  </div>

  <script>
    // Affiche le message d'erreur si l'URL contient ?error=invalid_key
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('error') === 'invalid_key') {
      document.getElementById('error-msg').classList.add('show');
    }
    
    // Focus automatique sur le champ de saisie
    document.getElementById('api_key').focus();
  </script>

</body>
</html>
