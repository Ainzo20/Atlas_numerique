<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atlas Numérique du Cameroun</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/feather-icons"></script>
  <link rel="stylesheet" href="/static/css/base.css" />
  <link rel="stylesheet" href="/static/css/layout.css" />
  <link rel="stylesheet" href="/static/css/composants.css" />
  <link rel="stylesheet" href="/static/css/carte.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script> 
  <link rel="stylesheet" href="/static/css/responsive.css" />
</head>
<body>

  <header class="topbar">
    <div class="topbar-brand">
      <div class="brand-flag">
        <span class="flag-green"></span><span class="flag-red"></span><span class="flag-yellow"></span>
      </div>
      <span class="brand-title">Atlas Numérique</span>
    </div>
    <div class="topbar-actions" id="topbarActions">
      <!-- Connexion / Import / Deconnexion injectes par ui-state.js -->
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <!-- Nav generee par components/sidebar.js -->
    </aside>

    <main class="main" id="app">
      <!-- Contenu de la page courante, injecte par router.js -->
    </main>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" onclick="event.stopPropagation()">
      <button class="modal-close" id="modalClose"><i data-feather="x"></i></button>
      <div class="modal-content" id="modalContent"></div>
    </div>
  </div>

  <script type="module" src="/static/js/core/api.js"></script>
<script type="module" src="/static/js/core/ui-state.js"></script>
<script type="module">
  import { updateUIForAuthState } from "/static/js/core/ui-state.js";
  window.updateUIForAuthState = updateUIForAuthState; // expose au script classique auth.js
</script>
<script type="module" src="/static/js/core/router.js"></script>
<script src="/static/js/core/auth.js"></script>
<script type="module" src="/static/js/main.js"></script>
</body>
</html>
